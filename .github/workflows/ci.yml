name: CI

on:
  push:
    branches: [main]
    paths: ['tui/**', 'bin/**']
  pull_request:
    branches: [main]
    paths: ['tui/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: tui

      - name: Test
        run: cd tui && go test ./... -v -count=1

      - name: Verify build compiles
        run: cd tui && go build ./...