name: Release jinx-tui

on:
  push:
    tags:
      - 'tui/v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: tui

      - name: Test
        run: cd tui && go test ./... -v -count=1

      - name: Build binaries
        run: |
          cd tui
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/jinx-tui-linux-arm64 ./cmd/jinx-tui/
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/jinx-tui-linux-arm ./cmd/jinx-tui/
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/jinx-tui-linux-amd64 ./cmd/jinx-tui/

      - name: Generate checksums
        run: cd tui/dist && sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v1
        with:
          files: tui/dist/*
          body: |
            ## jinx-tui v${{ github.ref_name }}

            Pre-built binaries for ARM64, ARM, and AMD64.

            ### Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/waldnerverges27-collab/jin-termx/main/install-tui.sh | bash
            ```
